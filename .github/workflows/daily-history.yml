# Quiet daily run for calibration/back-testing: IRM observations only (a few hundred KB),
# no forecast download, no fallback, NO deploy. Disable with history.enabled: false
# in config/pipeline.yaml, or disable this workflow in the Actions tab.
name: daily-history

on:
  schedule:
    - cron: "17 5 * * *"       # 05:17 UTC, off the busy top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-data
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies (no GRIB tools needed)
        run: pip install "requests>=2.31" "PyYAML>=6.0"

      - name: Fetch observations and append history
        run: python -m pipeline daily-history

      - name: Commit history (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No new history rows: nothing to commit."
          else
            git commit -m "data: observed history $(date -u +%Y-%m-%d) [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi
