# Manual weather update: check run -> download -> process -> validate -> JSON -> deploy.
# Started from the Actions tab ("Run workflow") or by the app's optional Refresh button.
name: update-weather

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-data          # one data update / deploy at a time
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write          # commit the compact calibration history
      pages: read              # read the published site URL
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Load previously published inputs (to skip already-processed runs)
        run: python -m pipeline fetch-previous --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Fetch forecast (ECMWF, fallback Open-Meteo)
        run: python -m pipeline fetch-forecast

      - name: Fetch observations (IRM/KMI, fallback Open-Meteo)
        run: python -m pipeline fetch-observations

      - name: Build static frontend
        run: python -m pipeline site

      - name: Score conditions and generate tips
        run: python -m pipeline score

      - name: Validate generated data
        run: python -m pipeline validate

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Append calibration history
        run: python -m pipeline history

      - name: Commit history (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No new history rows: nothing to commit."
          else
            git commit -m "data: calibration history $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
