# Region configuration. Adding a region = adding an entry here (no code change).
# Coordinates in decimal degrees (WGS84). Timezone = IANA name, used for display
# and for "daytime" windows only; all internal data is UTC.
regions:
  - id: be-namur
    country: BE
    name:
      en: "Namur area (Wallonia)"
      fr: "Région de Namur (Wallonie)"
    lat: 50.47
    lon: 4.87
    timezone: Europe/Brussels
    stations:
      # Stations are discovered dynamically from the provider, never hardcoded.
      max_distance_km: 60      # ignore stations further away than this
      max_candidates: 3        # try up to N nearest stations, per variable
      min_completeness: 0.7    # share of hours a station must deliver for a variable
    providers:
      # Ordered: first = primary, next = fallback. Names map to providers/registry.py
      forecast: [ecmwf, openmeteo]
      observation: [irm_aws, openmeteo_past]

